services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ankur_biswas
      POSTGRES_PASSWORD: Trelleborg@123
      POSTGRES_DB: taskflow
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    command: redis-server --appendonly yes --requirepass Trelleborg@123
    ports:
      - "6379:6379"